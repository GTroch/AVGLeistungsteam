<style>
:root {
  --bg: #f3f3f1;
  --card: #ffffff;
  --ink: #111111;
  --ink2: #55554f;
  --ink3: #8a8a83;
  --line: #e2e2dc;
  --accent: #d9122b;
  --accent-ink: #ffffff;
  --accent-soft: #fde8eb;
  --ok: #15803d;
  --ok-soft: #e3f5e9;
  --warn: #b45309;
  --warn-soft: #fdf1dc;
  --bar: #111111;
  --bar-ink: #ffffff;
  --logo-filter: none;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e0e; --card: #1b1b1b; --ink: #f2f2ef; --ink2: #bdbdb6; --ink3: #85857f;
    --line: #2c2c2c; --accent: #ff3b52; --accent-soft: #3a1419; --ok: #4ade80; --ok-soft: #10301c;
    --warn: #fbbf24; --warn-soft: #3a2b0c; --bar: #000; --logo-filter: invert(1);
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0e0e0e; --card: #1b1b1b; --ink: #f2f2ef; --ink2: #bdbdb6; --ink3: #85857f;
    --line: #2c2c2c; --accent: #ff3b52; --accent-soft: #3a1419; --ok: #4ade80; --ok-soft: #10301c;
    --warn: #fbbf24; --warn-soft: #3a2b0c; --bar: #000; --logo-filter: invert(1);
    --shadow: none;
    color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
body { min-height: 100vh; overscroll-behavior-y: contain; }
h1, h2, h3 { line-height: 1.2; margin: 0; }
h2 { font-size: 1.25rem; margin: 22px 0 10px; letter-spacing: -.01em; }
h3 { font-size: 1.05rem; }
a { color: inherit; }
p { margin: 6px 0; }
.muted { color: var(--ink2); }
.small { font-size: .85rem; }
.tiny { font-size: .75rem; color: var(--ink3); }
[hidden] { display: none !important; }

/* Splash */
.splash { position: fixed; inset: 0; z-index: 100; background: #fff; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px; padding: 24px; transition: opacity .4s; cursor: pointer; }
.splash.out { opacity: 0; pointer-events: none; }
.splash-logo { width: min(86vw, 460px); height: auto; animation: pop .7s cubic-bezier(.2,1.4,.4,1) both; }
.splash-sub { color: #444; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: .85rem; margin: 0; }
@keyframes pop { from { transform: scale(.85); opacity: 0 } to { transform: none; opacity: 1 } }

/* Top + Tabs */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px;
  padding: calc(8px + var(--safe-t)) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); background: var(--bar); color: var(--bar-ink); min-height: 56px; }
.topbar h1 { font-size: 1.1rem; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-logo { height: 34px; width: auto; filter: invert(1); }
.icon-btn { background: none; border: 0; color: inherit; width: 40px; height: 40px; border-radius: 10px;
  display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:active { background: rgba(255,255,255,.15); }
.view { padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(96px + var(--safe-b)) max(16px, env(safe-area-inset-left, 0px)); max-width: 720px; margin: 0 auto; }
.tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; background: var(--card);
  border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px;
  text-decoration: none; color: var(--ink3); font-size: .7rem; font-weight: 600; }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabbar a.on { color: var(--accent); }
body.workout .tabbar { display: none; }

/* Cards & lists */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin: 10px 0;
  border: 1px solid var(--line); }
.card.hero { background: var(--ink); color: var(--bg); border: 0; }
.card.hero .muted { color: inherit; opacity: .75; }
.card.warn { background: var(--warn-soft); border-color: transparent; }
.card.tip { background: var(--accent-soft); border-color: transparent; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.list { list-style: none; padding: 0; margin: 0; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; margin: 8px 0; cursor: pointer; text-decoration: none; color: inherit; }
.item:active { transform: scale(.99); }
.item .t { font-weight: 650; }
.item .s { color: var(--ink2); font-size: .85rem; }
.chev { color: var(--ink3); flex: none; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.badge { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px;
  background: var(--line); color: var(--ink2); white-space: nowrap; }
.badge.accent { background: var(--accent); color: var(--accent-ink); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.stat b { display: block; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .72rem; color: var(--ink2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Buttons & Forms */
.btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-weight: 650;
  padding: 10px 14px; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn-danger { color: var(--accent); }
.btn-lg { padding: 14px 28px; font-size: 1.1rem; border-radius: 99px; }
.btn-sm { padding: 6px 10px; font-size: .85rem; border-radius: 10px; }
.btn-block { width: 100%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.btns .btn { flex: 1 1 auto; }
label.f { display: block; margin: 12px 0 4px; font-weight: 600; font-size: .9rem; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
textarea { min-height: 80px; resize: vertical; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink2); padding: 6px 12px; border-radius: 99px;
  font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choice button { padding: 16px 8px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--ink);
  font: inherit; font-weight: 700; cursor: pointer; }
.choice button .ic { font-size: 1.8rem; display: block; }
.choice button.on { border-color: var(--accent); background: var(--accent-soft); }

/* Plan detail / editor */
.day { margin: 14px 0; }
.day-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.ex-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.ex-row:first-child { border-top: 0; }
.ex-row .num { width: 22px; height: 22px; border-radius: 50%; background: var(--line); font-size: .75rem; font-weight: 700;
  display: grid; place-items: center; flex: none; margin-top: 2px; }
.ed-item { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin: 8px 0; background: var(--bg); }
.ed-grid { display: grid; grid-template-columns: 60px 1fr 74px; gap: 6px; margin-top: 6px; }
.ed-grid input { padding: 8px; font-size: .9rem; }
.ed-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.ed-grid2 input { padding: 8px; font-size: .9rem; }
.mini-l { font-size: .68rem; color: var(--ink3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

/* Workout */
.wo-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 12px 0; }
.wo-card.done { border-color: var(--ok); }
.wo-target { font-size: .85rem; color: var(--ink2); margin: 2px 0 8px; }
.sets { display: grid; grid-template-columns: 34px 1fr 1fr 48px; gap: 6px; align-items: center; }
.sets .h { font-size: .7rem; color: var(--ink3); font-weight: 700; text-transform: uppercase; }
.sets input { padding: 8px; text-align: center; font-variant-numeric: tabular-nums; }
.chk { width: 44px; height: 40px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); cursor: pointer;
  display: grid; place-items: center; color: transparent; font-size: 1.2rem; font-weight: 900; }
.chk.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.last { font-size: .78rem; color: var(--ok); margin-bottom: 6px; }
.restbar { position: fixed; left: 8px; right: 8px; bottom: calc(8px + var(--safe-b)); z-index: 30; background: var(--ink); color: var(--bg);
  border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.3); max-width: 700px; margin: 0 auto; }
.restbar .btn { background: transparent; color: var(--bg); border-color: rgba(127,127,127,.5); }
.restbar .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.rest-label { font-size: .8rem; opacity: .7; }
.rest-time { font-size: 1.6rem; font-weight: 800; flex: 1; font-variant-numeric: tabular-nums; }
.restbar.alarm { background: var(--accent); }
.timer-big { font-size: 4rem; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; margin: 10px 0; }
.rpe { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.rpe button { padding: 10px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-weight: 800; cursor: pointer; }
.rpe button.on { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Charts */
.bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: 8px; }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.bar i { display: block; width: 100%; background: var(--ink); border-radius: 6px 6px 2px 2px; min-height: 2px; }
.bar.cur i { background: var(--accent); }
.bar span { font-size: .65rem; color: var(--ink3); }
.spark { width: 100%; height: 70px; }

/* Modal */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 720px; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0;
  padding: 18px 16px calc(18px + var(--safe-b)); animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0 } to { transform: none; opacity: 1 } }
.sheet h3 { margin-bottom: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + var(--safe-b)); z-index: 60; background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 99px; font-weight: 600; font-size: .9rem; max-width: 90vw; text-align: center; }

/* QR */
.qr-box { background: #fff; padding: 14px; border-radius: 16px; display: flex; justify-content: center; margin: 10px auto; max-width: 380px; }
.qr-box svg, .qr-box img { width: 100%; height: auto; display: block; image-rendering: pixelated; }
.scan-wrap { position: relative; background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 1; max-width: 420px; margin: 10px auto; }
.scan-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scan-frame { position: absolute; inset: 14%; border: 3px solid rgba(255,255,255,.9); border-radius: 18px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); }
.progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ok); }

.cue { margin: 4px 0 0 0; padding-left: 20px; }
.cue li { margin: 3px 0; }
.empty { text-align: center; padding: 30px 10px; color: var(--ink2); }
.empty .big { font-size: 2.6rem; }
.inline-logo { width: 100%; max-width: 280px; display: block; margin: 0 auto; filter: var(--logo-filter); }

/* Paket 1: Befinden */
.scale { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.scale.two { grid-template-columns: 1fr 1fr; }
.scale button { padding: 9px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-weight: 800; cursor: pointer; }
.scale button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.scale-l { min-height: 1.2em; margin: 2px 0 0; }
details.wb { margin-top: 12px; } details.wb summary { cursor: pointer; }
.cp-row { padding: 4px 0; } .cp-row select { width: 76px; padding: 6px 8px; }

/* Paket 2: Kalender & Verteilung */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
.cal-h { text-align: center; font-size: .7rem; font-weight: 700; color: var(--ink3); }
.cal-d { position: relative; aspect-ratio: 1; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font: inherit; padding: 3px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; cursor: pointer; min-width: 0; }
.cal-d.empty { border: 0; background: transparent; cursor: default; }
.cal-d.today { border: 2px solid var(--accent); }
.cal-d.ev { box-shadow: inset 0 0 0 2px #d97706; }
.cal-n { font-size: .78rem; font-weight: 700; }
.cal-dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; min-height: 7px; }
.cal-dots i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.cal-sick { position: absolute; left: 4px; right: 4px; bottom: 2px; height: 2px; border-radius: 2px; background: var(--warn); }
.legend-row { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 10px; font-size: .72rem; color: var(--ink2); }
.legend-row i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.legend-row i.ring { background: none; box-shadow: inset 0 0 0 2px #d97706; border-radius: 3px; }
.legend-row i.bar-s { width: 12px; height: 3px; border-radius: 2px; background: var(--warn); vertical-align: 2px; }
.stack { display: flex; height: 14px; border-radius: 99px; overflow: hidden; margin: 8px 0 6px; background: var(--line); }
.stack i { display: block; height: 100%; }
.dist-r { padding: 3px 0; }

.sets.one { grid-template-columns: 34px 1fr 48px; }
.sets .h { font-size: .66rem; letter-spacing: .02em; }
.cp-row select { width: 150px; }

</style>
</head>

  <script>/* js/app.js */
/* AVG Leistungsteam – App-Logik (läuft komplett lokal, Daten im localStorage) */
'use strict';

(function setupManifest() {

  let steps;
  if (isIOS) {

/* ================= Helpers ================= */
const $ = (s, r = document) => r.querySelector(s);

const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => new Date(d + (d.length === 10 ? 'T12:00:00' : '')).toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: '2-digit' });
const fmtSec = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const clone = o => JSON.parse(JSON.stringify(o));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const rid = id => String(id).replace(/_/g, '-');
const CHEV = '<svg class="chev" viewBox="0 0 24 24" width="20" height="20"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ================= Speicher ================= */
const KEY = 'avg-leistungsteam-v1';
function blank() {

})();

  try { localStorage.setItem(KEY, JSON.stringify(S)); }

}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ================= Übungen ================= */
const EXMAP = Object.fromEntries(EXERCISES.map(e => [e.id, e]));
function ex(id) { return EXMAP[id] || S.customEx.find(e => e.id === id) || { id, n: 'Unbekannte Übung', cat: 'kraft', d: '', c: [], sp: '' }; }
function allEx() { return EXERCISES.concat(S.customEx); }
function catDot(cat) { return `<span class="dot" style="background:${(CATS[cat] || CATS.kraft).color}"></span>`; }
function sportBadge(sp) { return sp && SPORTS[sp] ? `<span class="badge">${SPORTS[sp].icon} ${SPORTS[sp].name}</span>` : '<span class="badge">Allgemein</span>'; }

function planFromTemplate(t) {
  return { id: uid(), name: t.name, sport: t.sport, weeks: t.weeks, dl: t.dl, notes: t.notes, src: 'Vorlage', created: today(),
    days: t.days.map(d => ({ n: d.n, i: d.i.map(([e, sets, reps, rest, load, note]) => ({ ex: e, sets, reps, rest, load, note })) })) };
}

/* ================= UI-Grundgerüst ================= */
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
}
function openModal(html, onMount) {
  const m = $('#modal'); $('#sheet').innerHTML = html; m.hidden = false;
  if (onMount) onMount($('#sheet'));
}
function closeModal() { $('#modal').hidden = true; $('#sheet').innerHTML = ''; stopCamera(); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function confirmBox(text, okLabel = 'OK', danger = false) {
  return new Promise(res => {
    openModal(`<h3>${esc(text)}</h3><div class="btns"><button class="btn" data-x="0">Abbrechen</button>
      <button class="btn ${danger ? 'btn-primary' : 'btn-dark'}" data-x="1">${esc(okLabel)}</button></div>`, sh => {
      $$('[data-x]', sh).forEach(b => b.onclick = () => { closeModal(); res(b.dataset.x === '1'); });
    });
  });
}

function setTitle(t, back) {
  $('#title').textContent = t;
  $('#backBtn').hidden = !back;
  $('#topLogo').hidden = !!back;
}
$('#backBtn').onclick = () => history.length > 1 ? history.back() : go('#home');
$('#scanBtn').onclick = () => go('#scan');
function go(h) { if (location.hash === h) route(); else location.hash = h; }

/* ================= Router ================= */
const ROUTES = {
  home: viewHome, plans: viewPlans, plan: viewPlan, edit: viewEdit, templates: viewTemplates,
  lib: viewLib, ex: viewEx, log: viewLog, tests: viewTests, more: viewMore,
  scan: viewScan, share: viewShare, workout: viewWorkout, onboard: viewOnboard, safety: viewSafety, profile: viewProfile, beschwerden: viewComplaints, wettkaempfe: viewEvents, arten: viewTypes, bericht: viewReport, kader: viewKader, athlet: viewAthlete
};
let pendingImport = null;
function route() {
  closeModal(); stopShareCycle();
  const h = location.hash || '#home';
  if (h.startsWith('#import=')) { const code = decodeURIComponent(h.slice(8)); history.replaceState(null, '', '#home'); route(); if (S.profile.onboarded) handleCode(code); else pendingImport = code; return; }
  const m = /^#([a-z]+)(?:-(.*))?$/.exec(h) || [];
  const name = m[1] || 'home', arg = m[2] ? m[2].replace(/-/g, '_') : undefined;
  if (!S.profile.onboarded && name !== 'onboard' && name !== 'safety') { location.replace('#onboard'); return; }
  const fn = ROUTES[name] || viewHome;
  document.body.classList.toggle('workout', name === 'workout' || name === 'onboard');
  $$('.tabbar a').forEach(a => a.classList.toggle('on', a.dataset.tab === tabOf(name)));
  $('#view').innerHTML = '';
  fn(arg);
  window.scrollTo(0, 0);
}
function tabOf(n) { return { plan: 'plans', edit: 'plans', templates: 'plans', share: 'plans', ex: 'lib', tests: 'more', safety: 'more', profile: 'more', beschwerden: 'log', wettkaempfe: 'log', arten: 'log', bericht: 'log', kader: 'more', athlet: 'more' }[n] || n; }
window.addEventListener('hashchange', route);

function V(html) { $('#view').innerHTML = html; return $('#view'); }

/* ================= Onboarding ================= */
function viewOnboard() {

/* ================= Start ================= */
function weekKey(d) {
  const dt = new Date(d + 'T12:00:00'); const day = (dt.getDay() + 6) % 7; dt.setDate(dt.getDate() - day);
  return dt.toISOString().slice(0, 10);
}
function weekLoads(n = 8) {
  const out = []; const now = new Date(); const mon = new Date(weekKey(today()) + 'T12:00:00');
  for (let i = n - 1; i >= 0; i--) {
    const k = new Date(mon); k.setDate(mon.getDate() - 7 * i); const key = k.toISOString().slice(0, 10);
    const entries = S.log.filter(l => weekKey(l.date) === key && l.type !== 'befinden');
    out.push({ key, load: entries.reduce((a, l) => a + (l.rpe || 0) * (l.dur || 0), 0), count: entries.length, min: entries.reduce((a, l) => a + (l.dur || 0), 0) });
  }
  void now; return out;
}
function loadWarning() {
  const w = weekLoads(5); const cur = w[4].load; const prev = w.slice(0, 4).map(x => x.load); const avg = prev.reduce((a, b) => a + b, 0) / 4;
  if (avg > 0 && cur > avg * 1.5 && cur > 600) return `Deine Belastung diese Woche (${cur}) liegt deutlich über deinem Schnitt der letzten 4 Wochen (${Math.round(avg)}). Plane genug Erholung ein!`;
  return '';
}

  if (!S.activePlan || S.activePlan.id !== plan.id) return null;
  const days = Math.floor((new Date(today()) - new Date(S.activePlan.start)) / 864e5);
  return Math.floor(days / 7) + 1;
}
function isDeload(plan, wk) { return plan.dl > 0 && wk && wk % plan.dl === 0; }
function nextDayIdx(plan) {
  const last = S.log.find(l => l.planId === plan.id);

}

}
/* Befindens-Block für Trainings- und Pausetag-Einträge. mode: 'training' | 'day' */
function wellnessHtml(mode) {
  const act = activeComplaints();
  return `${scaleHtml('sl', 'Schlaf letzte Nacht', 0)}
    ${mode === 'training' ? scaleHtml('ei', 'Energie im Training', 0) + scaleHtml('eo', 'Energie direkt nach dem Training', 0) : scaleHtml('ed', 'Energie heute', 0)}

function bindWellness(sh) {

function backupDue() {

async function doBackup() {

      await navigator.share({ files: [file], title: 'AVG Leistungsteam – Datensicherung' });

}

function exerciseHistory(id) {
  const out = [];

  }
  return out;
}

/* ================= Training ================= */
async function startWorkout(planId, dayIdx) {
  if (S.wip) {
    if (!await confirmBox('Es läuft noch ein Training. Verwerfen und neu starten?', 'Neu starten', true)) { go('#workout'); return; }
  }
  const p = S.plans.find(x => x.id === planId); const d = p.days[dayIdx];
  const wk = planWeek(p); const dl = isDeload(p, wk);
  S.wip = { planId, dayIdx, title: d.n, start: Date.now(), deload: dl,
    items: d.i.map(it => {
      const h = exerciseHistory(it.ex)[0]; let n = parseInt(it.sets) || 1; if (dl) n = Math.max(1, Math.ceil(n / 2));
      const repGuess = String(it.reps).match(/^\d+/) ? String(it.reps).match(/^\d+/)[0] : '';
      return { ex: it.ex, target: it, sets: Array.from({ length: n }, (_, k) => ({ r: h && h.sets[k] ? h.sets[k].r : repGuess, kg: h && h.sets[k] ? h.sets[k].kg || '' : '', pn: '', done: false })) };
    }) };
  save(); go('#workout');
}
/* Welche Eingaben passen zu dieser Übung? a = erste Spalte (Wdh./Sekunden/Minuten), b = zweite Spalte (kg, Schmerz) oder keine */
function exMeasure(e, t) {
  const reps = String(t.reps || ''), name = String(e.n || ''), load = String(t.load || '');
  const isMin = /\bmin\b/i.test(reps), timed = isTimed(reps);
  const side = /bein/i.test(reps) ? ' je Bein' : /arm/i.test(reps) ? ' je Arm' : /seite/i.test(reps) ? ' je Seite' : '';
  const a = timed ? { h: (isMin ? 'Minuten' : 'Sekunden') + side, ph: isMin ? 'min' : 's', unit: isMin ? ' min' : ' s' }
    : { h: side ? 'Wdh.' + side : 'Wiederholungen', ph: 'Anzahl', unit: '' };
  if (/schmerz/i.test(name)) return { a, b: { key: 'pn', h: 'Schmerz 0–10', ph: '0–10', max: 10 } };
  const weighted = /hantel|kettlebell|gewicht|rucksack|medizinball|zusatzlast/i.test(String(e.eq || '') + ' ' + load) || /\bkg\b/i.test(load);
  if (weighted) return { a, b: { key: 'kg', h: /medizinball/i.test(String(e.eq || '')) ? 'Ball (kg)' : 'Gewicht (kg)', ph: 'kg', max: 300 } };
  return { a, b: null };
}
function setText(e, t, st) {
  const m = exMeasure(e, t);
  return (st.r ? st.r + m.a.unit : '–') + (st.kg ? ' × ' + st.kg + ' kg' : '') + (st.pn !== undefined && st.pn !== '' ? ' · Schmerz ' + st.pn : '');
}
function isTimed(reps) { return /\b(s|min|sek)\b/i.test(String(reps)); }
function timedSeconds(reps) {
  const m = String(reps).match(/(\d+)(?:\s*[–-]\s*(\d+))?\s*(s|min)/i); if (!m) return 30;
  const v = parseInt(m[1]); return m[3].toLowerCase() === 'min' ? v * 60 : v;
}

/* ---------- Pausen-Timer ---------- */
let restEnd = 0, restInt = null, audioCtx = null;
function beep(times = 3) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < times; i++) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + i * 0.25; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.start(t); o.stop(t + 0.2);
    }
  } catch (e) { /* kein Audio */ }
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
function startRest(sec) {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) { /* */ }
  restEnd = Date.now() + sec * 1000; $('#restbar').hidden = false; $('#restbar').classList.remove('alarm');
  clearInterval(restInt); restInt = setInterval(tickRest, 250); tickRest();
}
function tickRest() {
  const left = (restEnd - Date.now()) / 1000; $('#restTime').textContent = fmtSec(Math.ceil(left));
  if (left <= 0) { clearInterval(restInt); restInt = null; $('#restbar').classList.add('alarm'); $('#restTime').textContent = 'Los!'; beep(); setTimeout(stopRest, 2500); }
}
function stopRest() { clearInterval(restInt); restInt = null; $('#restbar').hidden = true; }
$('#restPlus').onclick = () => { restEnd += 15000; tickRest(); };
$('#restMinus').onclick = () => { restEnd -= 15000; tickRest(); };
$('#restSkip').onclick = stopRest;

function exerciseTimer(sec, name) {
  let int = null;
  openModal(`<h3>${esc(name)}</h3><div class="timer-big" id="tb">${fmtSec(sec)}</div>
    <div class="btns"><button class="btn" id="tx">Schließen</button><button class="btn btn-primary" id="tg">Start</button></div>`, sh => {
    const tb = $('#tb', sh), tg = $('#tg', sh);
    const stop = () => { clearInterval(int); int = null; };
    $('#tx', sh).onclick = () => { stop(); closeModal(); };
    tg.onclick = () => {
      if (int) { stop(); tg.textContent = 'Start'; tb.textContent = fmtSec(sec); return; }
      try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) { /* */ }
      tg.textContent = 'Stopp';
      const t0 = Date.now() + 3000, end = t0 + sec * 1000; let started = false;
      const tick = () => {
        if (!document.body.contains(tb)) return stop();
        const now = Date.now();
        if (now < t0) { tb.textContent = Math.ceil((t0 - now) / 1000); return; }
        if (!started) { started = true; beep(1); }
        const left = (end - now) / 1000; tb.textContent = fmtSec(Math.ceil(left));
        if (left <= 0) { stop(); tb.textContent = 'Geschafft!'; beep(3); tg.textContent = 'Nochmal'; }
      };
      int = setInterval(tick, 200); tick();
    };
  });
}

/* ================= QR: Kodieren / Teilen ================= */
/* QR-Format 2: Plan -> JSON -> LZ-komprimiert (Bytes) -> Base44 (nur QR-Alphanumerik-Zeichen, ohne Leerzeichen).
   Alphanumerik-Modus + Fehlerkorrektur L + max. ~440 Zeichen je Code = höchstens Version 11 (61 × 61 Module):
   grob genug für jede Handykamera, auch ausgedruckt. Das alte Format (AVGLT1) wird weiterhin gelesen. */
/* Format 3 (Standard): wie Format 2, aber mit Deflate statt LZ komprimiert (ca. 40 % weniger Zeichen → weniger Codes).
   Braucht CompressionStream (Chrome/Android ab 80, Safari/iOS ab 16.4); sonst automatisch Format 2. */

    if (total > maxBytes) { reader.cancel(); throw new Error('Daten zu groß'); } chunks.push(value); }

    else { const v = bytes[i]; o += B44[v % 44] + B44[Math.floor(v / 44)]; }
  }

}

  for (let i = 0; i < str.length; i += 3) {
    if (i + 2 < str.length) { const v = val(str[i]) + val(str[i + 1]) * 44 + val(str[i + 2]) * 1936; if (v > 65535) throw new Error('Daten'); out.push(v >> 8, v & 255); }

  const payload = { k: 'plans',
    x: [...usedCustom].map(id => { const e = ex(id); return trimArr([id, e.n, e.cat, e.eq || '', e.d || '', (e.c || []).join('\n')]); }),
    p: plans.map(p => [p.name, p.sport || '', p.weeks || 0, p.dl || 0, p.notes || '', p.days.map(d => [d.n, d.i.map(i => trimArr([i.ex, i.sets, i.reps, i.rest, i.load || '', i.note || '']))])]) };

let camStream = null, scanLoop = null, scanParts = null;
function stopCamera() {
  if (scanLoop) { cancelAnimationFrame(scanLoop); clearTimeout(scanLoop); scanLoop = null; }
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
}
function viewScan() {
  setTitle('QR-Code scannen', true);
  scanParts = null;
  const v = V(`
    <p class="small muted">Halte die Kamera auf den QR-Code deiner Lehrkraft.</p>
    <div class="scan-wrap" id="sw"><video id="vid" playsinline muted></video><div class="scan-frame"></div></div>
    <div id="scanStatus" class="small" style="text-align:center;min-height:2.6em"></div>
    <div class="btns"><button class="btn btn-danger" id="scanCancel">✕ Abbrechen</button><button class="btn" id="scanReset" hidden>↺ Neu beginnen</button><button class="btn btn-dark" id="camStart">📷 Kamera starten</button></div>
    <div class="card small" id="scanHelp" hidden><b>Klappt nicht?</b><ul class="cue">
      <li>Abstand ändern: Der Code sollte etwa zwei Drittel des Rahmens füllen.</li>
      <li>Bildschirm der Lehrkraft heller stellen, Spiegelungen vermeiden.</li>
      <li>Handy ruhig halten. Bei mehreren Codes kann die Lehrkraft mit ◀ ▶ einzeln weiterschalten.</li>
      <li>Oder ein Foto bzw. einen Screenshot des Codes verwenden: <b>Foto wählen</b>.</li></ul></div>
    <div class="btns"><label class="btn" for="imgIn">🖼 Foto wählen</label></div>
    <input type="file" id="imgIn" accept="image/*" hidden>
    <details class="card small"><summary><b>Code von Hand einfügen</b></summary>
      <textarea id="codeIn" placeholder="AVG3:…" style="margin-top:8px"></textarea><button class="btn btn-sm btn-dark" id="codeGo" style="margin-top:6px">Importieren</button></details>
  `);
  const status = $('#scanStatus', v);
  let helpT = setTimeout(() => { const h = $('#scanHelp', v); if (h) h.hidden = false; }, 15000);
  $('#scanCancel', v).onclick = () => { clearTimeout(helpT); stopCamera(); scanParts = null; toast('Scan abgebrochen'); go(S.plans.length ? '#plans' : '#home'); };
  $('#scanReset', v).onclick = () => { scanParts = null; status.textContent = 'Neu gestartet – suche QR-Code …'; $('#scanReset', v).hidden = true; };
  const start = async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { status.textContent = 'Kamera nicht verfügbar. Nutze „Foto wählen“ (die App muss über https geöffnet sein).'; return; }
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
      try { const tr = camStream.getVideoTracks()[0]; const cap = tr.getCapabilities ? tr.getCapabilities() : {};
        if (cap.focusMode && cap.focusMode.includes('continuous')) await tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) { /* optional */ }
    } catch (e) { status.textContent = 'Kein Kamerazugriff. Erlaube die Kamera in den Browser-Einstellungen oder nutze „Foto wählen“.'; return; }
    const vid = $('#vid', v); if (!vid) return stopCamera(); vid.srcObject = camStream; await vid.play().catch(() => {});
    $('#camStart', v).hidden = true; status.textContent = 'Suche QR-Code …';
    const det = ('BarcodeDetector' in window) ? new window.BarcodeDetector({ formats: ['qr_code'] }) : null;
    const cv = document.createElement('canvas'); const ctx = cv.getContext('2d', { willReadFrequently: true });
    const tick = async () => {
      if (!camStream) return;
      if (vid.readyState >= 2) {
        let txt = null;
        try {
          if (det) { const r = await det.detect(vid); if (r[0]) txt = r[0].rawValue; }
          else {
            // mittleren Bildausschnitt in voller Auflösung auswerten (bessere Erkennung als das verkleinerte Gesamtbild)
            const vw = vid.videoWidth, vh = vid.videoHeight, side = Math.round(Math.min(vw, vh) * 0.8);
            const out = Math.min(side, 800); cv.width = cv.height = out;
            ctx.drawImage(vid, (vw - side) / 2, (vh - side) / 2, side, side, 0, 0, out, out);
            const img = ctx.getImageData(0, 0, out, out);
            const r = jsQR(img.data, out, out, { inversionAttempts: 'dontInvert' }); if (r) txt = r.data; }
        } catch (e) { /* weiter */ }
        if (txt && onScanned(txt, status)) return;
      }
      scanLoop = setTimeout(tick, 150);
    };
    tick();
  };
  $('#camStart', v).onclick = start;
  start();
  $('#imgIn', v).onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(); img.onload = () => {
      const cv = document.createElement('canvas'); const s = Math.min(1600, Math.max(img.width, img.height)) / Math.max(img.width, img.height);
      cv.width = img.width * s; cv.height = img.height * s; const c = cv.getContext('2d'); c.drawImage(img, 0, 0, cv.width, cv.height);
      const r = jsQR(c.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height); URL.revokeObjectURL(img.src);
      if (!r) status.textContent = 'Im Foto wurde kein QR-Code gefunden.'; else onScanned(r.data, status);

  };

  v.addEventListener('scanprogress', () => { $('#scanReset', v).hidden = false; clearTimeout(helpT); });
}
/* liefert true, wenn fertig */
function onScanned(txt, status) {
  const m = /^(AVGLT1|AVG2|AVG3):(\d+)\/(\d+):([A-Za-z0-9]+):(.*)$/s.exec(txt.trim());
  if (!m) { status.textContent = 'Das ist kein Trainingsplan-Code der AVG-App.'; return false; }
  const ver = m[1], i = +m[2], n = +m[3], gid = m[4];
  if (n < 1 || n > 60 || i < 1 || i > n) return false;
  if (!scanParts || scanParts.gid !== gid) scanParts = { gid, n, ver, got: {} };
  if (!scanParts.got[i]) { scanParts.got[i] = m[5]; if (navigator.vibrate) navigator.vibrate(40); $('#view').dispatchEvent(new Event('scanprogress')); }
  const have = Object.keys(scanParts.got).length;
  if (have < n) {
    const missing = Array.from({ length: n }, (_, k) => k + 1).filter(k => !scanParts.got[k]);
    status.innerHTML = `<div class="progress"><i style="width:${have / n * 100}%"></i></div><b>${have} von ${n} Teilen erfasst</b><br><span class="muted">Fehlt noch: ${missing.join(', ')}</span>`;
    return false;
  }
  const data = Array.from({ length: n }, (_, k) => scanParts.got[k + 1]).join('');
  stopCamera(); scanParts = null; status.textContent = '✓ Code vollständig';
  handleCode(`${ver}:1/1:X:${data}`);
  return true;
}
async function decodePayload(code) {
  const m = /^(AVGLT1|AVG2|AVG3):1\/1:[A-Za-z0-9]+:(.*)$/s.exec(code.trim()); if (!m) throw new Error('Format');
  if (m[1] === 'AVG3' && !HAS_DEFLATE) throw new Error('Browser zu alt – bitte Handy/Browser aktualisieren (iPhone: ab iOS 16.4)');
  const json = m[1] === 'AVG3' ? await inflate(b44dec(m[2])) : m[1] === 'AVG2' ? LZString.decompressFromUint8Array(b44dec(m[2])) : LZString.decompressFromEncodedURIComponent(m[2]);
  if (!json) throw new Error('Daten beschädigt');
  const o = JSON.parse(json);
  if (o && o.k === 'report') return { report: sanitizeReport(o) };
  if (!o || o.k !== 'plans' || !Array.isArray(o.p)) throw new Error('Unbekannter Inhalt');
  const str = (v, max) => String(v == null ? '' : v).slice(0, max);
  const int = (v, lo, hi) => Math.min(hi, Math.max(lo, parseInt(v) || 0));
  const xs = (Array.isArray(o.x) ? o.x : []).slice(0, 100).map(a => ({ oid: str(a[0], 40), n: str(a[1], 50) || 'Übung', cat: CATS[a[2]] ? a[2] : 'kraft', eq: str(a[3], 40), d: str(a[4], 500), c: str(a[5], 300).split('\n').filter(Boolean) }));
  const plans = o.p.slice(0, 30).map(a => ({ name: str(a[0], 60) || 'Plan', sport: SPORTS[a[1]] ? a[1] : '', weeks: int(a[2], 0, 52), dl: int(a[3], 0, 12), notes: str(a[4], 600),
    days: (Array.isArray(a[5]) ? a[5] : []).slice(0, 14).map(d => ({ n: str(d[0], 40) || 'Einheit', i: (Array.isArray(d[1]) ? d[1] : []).slice(0, 40).map(i => ({
      ex: str(i[0], 40), sets: int(i[1], 1, 20), reps: str(i[2], 24), rest: int(i[3], 0, 600), load: str(i[4], 30), note: str(i[5], 80) })) })) }));
  return { plans, xs };
}
async function handleCode(code) {
  let res; try { res = await decodePayload(code); } catch (e) { toast('Code konnte nicht gelesen werden (' + e.message + ').'); return; }
  if (res.report) return receiveReport(res.report);
  const { plans, xs } = res;
  openModal(`<h3>Trainingsplan empfangen 📥</h3>
    ${plans.map(p => `<div class="card"><div class="row"><b class="grow">${esc(p.name)}</b>${sportBadge(p.sport)}</div>
      <p class="small muted">${p.days.length} Einheiten · ${p.days.reduce((a, d) => a + d.i.length, 0)} Übungen${p.weeks ? ' · ' + p.weeks + ' Wochen' : ''}</p>
      ${p.notes ? `<p class="small">${esc(p.notes)}</p>` : ''}</div>`).join('')}
    ${xs.length ? `<p class="small muted">Enthält ${xs.length} eigene Übung(en) der Lehrkraft.</p>` : ''}
    <label class="row"><input type="checkbox" id="impAct" style="width:auto" ${plans.length === 1 ? 'checked' : ''}> <span>Als aktiven Plan setzen</span></label>
    <div class="btns"><button class="btn" id="ix">Abbrechen</button><button class="btn btn-primary" id="ii">Importieren</button></div>`, sh => {
    $('#ix', sh).onclick = () => { closeModal(); route(); };
    $('#ii', sh).onclick = () => {
      const idMap = {};
      xs.forEach(x => { const same = S.customEx.find(c => c.n === x.n && c.d === x.d);
        if (same) idMap[x.oid] = same.id; else { const nid = 'c_' + uid(); idMap[x.oid] = nid; S.customEx.push({ id: nid, n: x.n, cat: x.cat, eq: x.eq, d: x.d, c: x.c, sp: '', custom: true, def: [3, '10', 60] }); } });
      const added = plans.map(p => { p.days.forEach(d => { d.i = d.i.map(i => ({ ...i, ex: EXMAP[i.ex] ? i.ex : (idMap[i.ex] || i.ex) })).filter(i => EXMAP[i.ex] || S.customEx.some(c => c.id === i.ex)); });
        return { ...p, id: uid(), src: 'per QR empfangen am ' + new Date().toLocaleDateString('de-DE'), created: today() }; });
      S.plans.unshift(...added);
      if ($('#impAct', sh).checked) S.activePlan = { id: added[0].id, start: today() };
      save(); closeModal(); toast(added.length === 1 ? 'Plan importiert ✓' : added.length + ' Pläne importiert ✓'); go('#plan-' + added[0].id);
    };
  });
}

function addDays(d, k) { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + k); return x.toISOString().slice(0, 10); }
function trimZ(a) { a = a.slice(); while (a.length && (a[a.length - 1] === '' || a[a.length - 1] == null || a[a.length - 1] === 0)) a.pop(); return a; }
function buildReport(days, opt) {
  if (!S.profile.rid) { S.profile.rid = uid(); save(); }
  const to = today(), from = addDays(to, -days + 1);
  const es = S.log.filter(l => l.date >= from && l.date <= to).sort(byTimeDesc).reverse();
  const tcode = t => TYPES[t] ? t : (customType(t) ? '~' + customType(t).name : 'sonst');

    try { localStorage.setItem('avg-lt-lastcheck', today()); } catch (e) { /* egal */ }
    updateInfo = verNum(m[1]) > verNum(APP_VERSION) ? { version: m[1] } : null;
    if (!silent) { if (updateInfo) showUpdate(); else toast('✓ Du hast die neueste Version (' + APP_VERSION + ').'); }
    return updateInfo;
  } catch (e) { if (!silent) toast('Update-Prüfung fehlgeschlagen. Bitte später erneut versuchen.'); return null; }
}
function showUpdate() {
  openModal(`<h3>🔄 Neue Version ${esc(updateInfo.version)} verfügbar</h3>
    <p class="small">Installiert ist Version ${APP_VERSION}. Das Update dauert nur einen Moment.</p>
    <div class="card tip small">Deine Daten (Pläne, Tagebuch, Tests, Beschwerden) bleiben erhalten – sie liegen getrennt von der App auf deinem Handy.</div>
    ${S.wip ? '<div class="card warn small">Ein Training läuft gerade. Es bleibt gespeichert und kann nach dem Update fortgesetzt werden.</div>' : ''}
    <div class="btns"><button class="btn" id="upLater">Später</button><button class="btn btn-primary" id="upNow">Jetzt aktualisieren</button></div>`, sh => {
    $('#upLater', sh).onclick = closeModal;
    $('#upNow', sh).onclick = applyUpdate;
  });
}
async function applyUpdate() {
  save();
  const btn = $('#upNow'); if (btn) { btn.disabled = true; btn.textContent = 'Wird aktualisiert …'; }
  try {
    const fresh = await fetch(pageUrl(), { cache: 'reload' });            // Browser-Zwischenspeicher erneuern
    if (fresh.ok && 'caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(async k => { const c = await caches.open(k); await c.put(pageUrl(), fresh.clone()); await c.put(new URL('./', pageUrl()).href, fresh.clone()); await c.put(new URL('index.html', pageUrl()).href, fresh.clone()); }));
    }
    if ('serviceWorker' in navigator) { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update().catch(() => {}); }
  } catch (e) { /* trotzdem neu laden */ }
  location.reload();
}
/* einmal am Tag still prüfen (nur online, nur Webseite/App) */
function autoCheck() {
  let last = null; try { last = localStorage.getItem('avg-lt-lastcheck'); } catch (e) { /* egal */ }
  if (last === today()) return;
  setTimeout(() => checkUpdate(true).then(u => { if (u && /^#?(home)?$/.test(location.hash.replace('#', ''))) route(); }), 3000);
}
autoCheck();

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

</script>
